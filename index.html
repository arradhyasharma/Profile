<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Spooky Synth</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050505; color: #ff6600; font-family: monospace; overflow: hidden; }
    #ui { position: absolute; top: 15px; width: 100%; text-align: center; pointer-events: none; z-index: 10; text-shadow: 0 0 8px #ff6600; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>HAUNTED 3D SYNTH</h2>
    <p>Click pads or press [A] [S] [D] [F]</p>
  </div>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    const light = new THREE.PointLight(0xff6600, 2, 50);
    light.position.set(0, 5, 5);
    scene.add(light);
    camera.position.z = 5;

    const padData = [
      { key: 'a', freq: 220, color: 0xff3300, x: -3 },
      { key: 's', freq: 330, color: 0xff6600, x: -1 },
      { key: 'd', freq: 440, color: 0xff9900, x: 1 },
      { key: 'f', freq: 554, color: 0xffcc00, x: 3 }
    ];

    const pads = [];
    const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);

    padData.forEach(d => {
      const mat = new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.3 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.x = d.x;
      mesh.userData = d;
      scene.add(mesh);
      pads.push(mesh);
    });

    let actx;
    function play(freq) {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, actx.currentTime);
      gain.gain.setValueAtTime(0.3, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.4);
    }

    function hit(mesh) {
      play(mesh.userData.freq);
      mesh.scale.set(1.4, 1.4, 1.4);
      setTimeout(() => mesh.scale.set(1, 1, 1), 120);
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', e => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(pads);
      if (hits.length) hit(hits[0].object);
    });

    window.addEventListener('keydown', e => {
      const p = pads.find(p => p.userData.key === e.key.toLowerCase());
      if (p) hit(p);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    (function loop() {
      requestAnimationFrame(loop);
      pads.forEach(p => { p.rotation.x += 0.01; p.rotation.y += 0.01; });
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
