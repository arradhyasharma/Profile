data:text/html,<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>3D Synth</title><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#050505;color:#f60;font-family:monospace;overflow:hidden}#ui{position:absolute;top:15px;width:100%;text-align:center;pointer-events:none;z-index:10;text-shadow:0 0 8px #f60}canvas{width:100vw;height:100vh;display:block}</style></head><body><div id="ui"><h2>HAUNTED 3D SYNTH</h2><p>Click pads or press [A] [S] [D] [F]</p></div><script>const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1e3),renderer=new THREE.WebGLRenderer({antialias:!0});renderer.setSize(window.innerWidth,window.innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.3));const light=new THREE.PointLight(0xff6600,2,50);light.position.set(0,5,5);scene.add(light);camera.position.z=5;const padData=[{key:"a",freq:220,color:0xff3300,x:-3},{key:"s",freq:330,color:0xff6600,x:-1},{key:"d",freq:440,color:0xff9900,x:1},{key:"f",freq:554,color:0xffcc00,x:3}],pads=[],geo=new THREE.BoxGeometry(1.2,1.2,1.2);padData.forEach(t=>{const e=new THREE.MeshStandardMaterial({color:t.color,roughness:.3}),a=new THREE.Mesh(geo,e);a.position.x=t.x,a.userData=t,scene.add(a),pads.push(a)});let actx;function play(t){actx||(actx=new(window.AudioContext||window.webkitAudioContext));const e=actx.createOscillator(),a=actx.createGain();e.type="sawtooth",e.frequency.setValueAtTime(t,actx.currentTime),a.gain.setValueAtTime(.3,actx.currentTime),a.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.4),e.connect(a),a.connect(actx.destination),e.start(),e.stop(actx.currentTime+.4)}function hit(t){play(t.userData.freq),t.scale.set(1.4,1.4,1.4),setTimeout(()=>t.scale.set(1,1,1),120)}const raycaster=new THREE.Raycaster,mouse=new THREE.Vector2;window.addEventListener("click",t=>{mouse.x=t.clientX/window.innerWidth*2-1,mouse.y=-(t.clientY/window.innerHeight)*2+1,raycaster.setFromCamera(mouse,camera);const e=raycaster.intersectObjects(pads);e.length&&hit(e[0].object)}),window.addEventListener("keydown",t=>{const e=pads.find(e=>e.userData.key===t.key.toLowerCase());e&&hit(e)}),window.addEventListener("resize",()=>{camera.aspect=window.innerWidth/window.innerHeight,camera.updateProjectionMatrix(),renderer.setSize(window.innerWidth,window.innerHeight)}),function t(){requestAnimationFrame(t),pads.forEach(t=>{t.rotation.x+=.01,t.rotation.y+=.01}),renderer.render(scene,camera)}();</script></body></html>
